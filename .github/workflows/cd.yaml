name: Deploy Blog Application
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ steps.deploy-frontend.outputs.url }}
    steps:
     
      - uses: actions/checkout@v4
     
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - uses: google-github-actions/auth@v2
        with:
          service_account: ${{ secrets.GOOGLECLOUD_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GOOGLECLOUD_CREDENTIALS }}
      
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/crave-backend:${{ github.sha }}

      
      - id: deploy-backend
        name: Deploy backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: crave-backend
          image: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/crave-backend:${{ github.sha }}
          region: ${{ secrets.GOOGLECLOUD_REGION }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/crave-frontend:${{ github.sha }}
          build-args: VITE_BACKEND_URL=${{ steps.deploy-backend.outputs.url }}/api/v1

      - id: deploy-frontend
        name: Deploy frontend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: crave-frontend
          image: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/crave-frontend:${{ github.sha }}
          region: ${{ secrets.GOOGLECLOUD_REGION }}